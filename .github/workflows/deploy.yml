# This workflow builds and deploys your Next.js application to Firebase App Hosting.
# It is triggered automatically whenever you push code to the 'main' branch.

name: Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main

# These permissions are required for the GitHub Action to authenticate with Google Cloud.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        # This action authenticates with Google Cloud using Workload Identity Federation.
        # It's the most secure method and recommended by Google.
        # ❗️ IMPORTANT: You need to set up Workload Identity Federation in your Google Cloud project.
        # For a detailed guide, see: https://github.com/google-github-actions/auth#setting-up-workload-identity-federation
        uses: 'google-github-actions/auth@v2'
        with:
          # You must create these secrets in your GitHub repository settings under "Secrets and variables" > "Actions".
          # 1. GCP_WORKLOAD_IDENTITY_PROVIDER: The full path of your Workload Identity Provider.
          #    e.g., projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          # 2. GCP_SERVICE_ACCOUNT: The email of the service account you created for this purpose.
          #    e.g., my-deploy-service-account@my-project.iam.gserviceaccount.com
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # 'npm ci' is recommended for CI environments as it provides faster, more reliable builds.
        run: npm ci

      - name: Build the application
        run: npm run build

      - name: Deploy to Firebase App Hosting
        # This action handles the deployment to Firebase App Hosting.
        uses: 'firebase/actions/deploy/app-hosting@v0'
        with:
          # ❗️ IMPORTANT: You must also create a secret named FIREBASE_PROJECT_ID with your Firebase Project ID.
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # The 'siteId' is the ID of your App Hosting backend.
          # You can find this ID after your first manual deployment or in the Firebase console.
          # For example, it might be the name of your app: 'integral-illusion'.
          # You can set it as a secret or directly here if you know it.
          # siteId: 'your-backend-id'
